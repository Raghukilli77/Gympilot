<!DOCTYPE html>
<html lang="en">
    <head>
        <title>add member form</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./css/addform.css">
    </head>
    <body>

    <form id="memberForm">
        <fieldset>
            <legend>Member Details</legend>
            
            <div class="form-group">
                <label for="memberName">Full Name</label>
                <input type="text" id="memberName" name="memberName" placeholder="Enter member name" required>
            </div>

            <div class="form-group">
                <label for="Phonenumber">Phone Number</label>
                <input type="tel" id="Phonenumber" name="phoneNumber" placeholder="Enter phone number" pattern="[0-9]{10}" required>
            </div>

            <div class="form-group">
                <label for="doj">Date of Joining</label>
                <input type="date" id="doj" name="doj" required>
            </div>

            <div class="form-group">
                <label>Plan Details</label>
                <div class="radio-group">
                    <input type="radio" id="planBasic" name="planDetails" value="Basic">
                    <label for="planBasic">Basic</label>
                    
                    <input type="radio" id="planPremium" name="planDetails" value="Premium">
                    <label for="planPremium">Premium</label>
                </div>
            </div>

            <div class="form-group">
                <label>Plan Duration</label>
                <div class="radio-group">
                    <input type="radio" id="plan1" name="planDuration" value="1">
                    <label for="plan1">1 Month</label>
                    
                    <input type="radio" id="plan3" name="planDuration" value="3">
                    <label for="plan3">3 Months</label>

                    <input type="radio" id="plan6" name="planDuration" value="6">
                    <label for="plan6">6 Months</label>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" id="addBtn">Add Member</button>
                <button type="button" id="updateBtn" hidden>Update Member</button>
                <button type="button" id="resetBtn">Reset</button>
            </div>

        </fieldset>
        <div id="paymentModal" class="payment-modal">
            <div class="payment-modal-content">

                <h2 id="modalTitle">Collect Payment</h2>

                <p id="modalSubtitle">
                    Enter initial payment details for this member.
                </p>

                <label for="paymentAmount">Amount Paid</label>

                <input
                    type="number"
                    id="paymentAmount"
                    placeholder="Enter amount"
                    min="0"
                    step="0.01"
                >

                <p id="modalLoadingMsg" style="display: none;"></p>

                <div class="payment-modal-actions">
                    <button type="button" id="cancelPaymentBtn">
                        Cancel
                    </button>

                    <button type="button" id="confirmPaymentBtn">
                        Save Member
                    </button>
                </div>

            </div>
        </div>
    </form>
        
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="./js/supabaseClient.js"></script>
        <script src="./js/storage.js"></script>
        <script src="js/utils/date.js"></script>
        <script src="./js/addmember.js"></script>
        <script src="./js/globalAlert.js"></script>
    </body>
</html>
